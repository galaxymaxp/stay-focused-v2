name: Release quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEMP: ${{ github.workspace }}/.local/test-temp
      TMP: ${{ github.workspace }}/.local/test-temp
      TMPDIR: ${{ github.workspace }}/.local/test-temp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: mkdir -p .local/test-temp
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck -- --force
      - run: npm run lint -- --force
      - run: npm test -w @stay-focused/shared
      - run: npm test -w @stay-focused/canvas
      - run: npm test -w @stay-focused/ocr
      - run: npm test -w @stay-focused/engine
      - run: npm test -w @stay-focused/api -- --maxWorkers=4
      - run: npx playwright install --with-deps chromium
      - run: npm test -w @stay-focused/mobile
      - run: npm test -w @stay-focused/web
      - run: npm run provider:contract -w @stay-focused/api
      - run: npm run build -- --force
